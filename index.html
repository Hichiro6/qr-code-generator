<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate QR codes for URLs, WiFi, vCards, text — 100% in your browser, nothing uploaded" />
  <meta name="color-scheme" content="dark light" />
  <title>QR Code Generator — Create QR Codes Online</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="header">
    <div class="header__inner">
      <div class="header__brand">
        <div class="header__logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="5" y="5" width="3" height="3" fill="#9a9bff"/>
            <rect x="16" y="3" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="18" y="5" width="3" height="3" fill="#9a9bff"/>
            <rect x="3" y="16" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="5" y="18" width="3" height="3" fill="#9a9bff"/>
            <path d="M16 16h3v3M22 16v6M16 22h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1 class="header__title">QR Code Generator</h1>
          <p class="header__tagline" data-i18n="app.tagline">Create QR codes for URLs, WiFi, vCards, text — 100% in your browser</p>
        </div>
      </div>
      <div class="header__actions">
        <span class="badge badge--privacy" data-i18n="privacy.badge" data-i18n-attr="title: privacy.tooltip">Client-side only</span>
        <div id="lang-selector"></div>
      </div>
    </div>
  </header>

  <main class="main" id="main-content">
    <div class="workspace">
      <!-- Tabs -->
      <div class="tabs" role="tablist" aria-label="QR Code type">
        <button class="tab tab--active" role="tab" id="tab-btn-url" aria-selected="true" aria-controls="tab-url" tabindex="0" data-tab="url" data-i18n="tabs.url">URL</button>
        <button class="tab" role="tab" id="tab-btn-wifi" aria-selected="false" aria-controls="tab-wifi" tabindex="-1" data-tab="wifi" data-i18n="tabs.wifi">WiFi</button>
        <button class="tab" role="tab" id="tab-btn-vcard" aria-selected="false" aria-controls="tab-vcard" tabindex="-1" data-tab="vcard" data-i18n="tabs.vcard">vCard</button>
        <button class="tab" role="tab" id="tab-btn-text" aria-selected="false" aria-controls="tab-text" tabindex="-1" data-tab="text" data-i18n="tabs.text">Text</button>
      </div>

      <div class="workspace__body">
        <!-- Left: Form -->
        <div class="pages-section">
          <!-- URL Tab -->
          <div id="tab-url" class="tab-panel tab-panel--active" role="tabpanel" aria-labelledby="tab-btn-url">
            <div class="control-group">
              <label for="url-input" class="control-label" data-i18n="form.url.label">Website URL</label>
              <input type="url" id="url-input" class="control-input" data-i18n="form.url.placeholder" placeholder="https://example.com" />
            </div>
          </div>

          <!-- WiFi Tab -->
          <div id="tab-wifi" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-wifi" hidden>
            <div class="control-group">
              <label for="wifi-ssid" class="control-label" data-i18n="form.wifi.ssid">Network Name (SSID)</label>
              <input type="text" id="wifi-ssid" class="control-input" data-i18n="form.wifi.placeholder.ssid" placeholder="MyWiFi" />
            </div>
            <div class="control-group">
              <label for="wifi-password" class="control-label" data-i18n="form.wifi.password">Password</label>
              <input type="text" id="wifi-password" class="control-input" data-i18n="form.wifi.placeholder.password" placeholder="secret123" />
            </div>
            <div class="control-group">
              <label for="wifi-encryption" class="control-label" data-i18n="form.wifi.encryption">Encryption</label>
              <select id="wifi-encryption" class="control-input">
                <option value="WPA">WPA/WPA2</option>
                <option value="WEP">WEP</option>
                <option value="nopass">No Password</option>
              </select>
            </div>
            <div class="control-group control-group--checkbox">
              <label for="wifi-hidden" class="control-label control-label--checkbox">
                <input type="checkbox" id="wifi-hidden" class="control-checkbox" />
                <span data-i18n="form.wifi.hidden">Hidden Network</span>
              </label>
            </div>
          </div>

          <!-- vCard Tab -->
          <div id="tab-vcard" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-vcard" hidden>
            <div class="control-row">
              <div class="control-group">
                <label for="vcard-prefix" class="control-label" data-i18n="form.vcard.prefix">Prefix</label>
                <input type="text" id="vcard-prefix" class="control-input" placeholder="Mr." />
              </div>
              <div class="control-group">
                <label for="vcard-firstname" class="control-label" data-i18n="form.vcard.firstName">First Name</label>
                <input type="text" id="vcard-firstname" class="control-input" data-i18n="form.vcard.placeholder.first" placeholder="John" />
              </div>
            </div>
            <div class="control-group">
              <label for="vcard-lastname" class="control-label" data-i18n="form.vcard.lastName">Last Name</label>
              <input type="text" id="vcard-lastname" class="control-input" data-i18n="form.vcard.placeholder.last" placeholder="Doe" />
            </div>
            <div class="control-group">
              <label for="vcard-org" class="control-label" data-i18n="form.vcard.organization">Organization</label>
              <input type="text" id="vcard-org" class="control-input" placeholder="Acme Inc." />
            </div>
            <div class="control-group">
              <label for="vcard-phone" class="control-label" data-i18n="form.vcard.phone">Phone</label>
              <input type="tel" id="vcard-phone" class="control-input" placeholder="+1 234 567 890" />
            </div>
            <div class="control-group">
              <label for="vcard-email" class="control-label" data-i18n="form.vcard.email">Email</label>
              <input type="email" id="vcard-email" class="control-input" placeholder="john@example.com" />
            </div>
            <div class="control-group">
              <label for="vcard-website" class="control-label" data-i18n="form.vcard.website">Website</label>
              <input type="url" id="vcard-website" class="control-input" placeholder="https://john.com" />
            </div>
            <div class="control-group">
              <label for="vcard-address" class="control-label" data-i18n="form.vcard.address">Address</label>
              <input type="text" id="vcard-address" class="control-input" placeholder="123 Main St, City" />
            </div>
            <div class="control-group">
              <label for="vcard-note" class="control-label" data-i18n="form.vcard.note">Note</label>
              <input type="text" id="vcard-note" class="control-input" placeholder="Software Engineer" />
            </div>
          </div>

          <!-- Text Tab -->
          <div id="tab-text" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-text" hidden>
            <div class="control-group">
              <label for="text-input" class="control-label" data-i18n="form.text.label">Your Text</label>
              <textarea id="text-input" class="control-input" rows="5" data-i18n="form.text.placeholder" placeholder="Enter your message..."></textarea>
            </div>
          </div>

          <!-- Options -->
          <div class="control-group">
            <label for="qr-size" class="control-label" data-i18n="options.size">Size</label>
            <select id="qr-size" class="control-input">
              <option value="256">256px</option>
              <option value="512" selected>512px</option>
              <option value="1024">1024px</option>
            </select>
          </div>
          <div class="control-row">
            <div class="control-group">
              <label for="qr-color" class="control-label" data-i18n="options.color">Color</label>
              <input type="color" id="qr-color" class="control-input control-color" value="#0f1011" />
            </div>
            <div class="control-group">
              <label for="qr-bg" class="control-label" data-i18n="options.bg">Background</label>
              <input type="color" id="qr-bg" class="control-input control-color" value="#ffffff" />
            </div>
          </div>
          <div class="control-group">
            <label for="qr-margin" class="control-label" data-i18n="options.margin">Margin</label>
            <input type="range" id="qr-margin" class="control-slider" min="0" max="10" value="2" />
            <span id="margin-value" class="slider-value">2</span>
          </div>

          <div class="actions">
            <button id="btn-generate" class="btn btn--primary" data-i18n="btn.generate">Generate QR Code</button>
            <button id="btn-reset" class="btn btn--ghost btn-sm" data-i18n="btn.reset">Reset</button>
          </div>
        </div>

        <!-- Right: QR Preview -->
        <aside class="controls-section">
          <h2 class="controls-title">QR Code</h2>
          <div id="qr-preview" class="qr-preview" aria-label="QR code preview">
            <p class="qr-placeholder" data-i18n="btn.generate">Generate QR Code</p>
          </div>
          <div id="qr-actions" class="actions" hidden>
            <button id="btn-download" class="btn btn--primary" data-i18n="btn.download">Download PNG</button>
            <button id="btn-download-svg" class="btn btn--secondary" data-i18n="btn.downloadSvg">Download SVG</button>
            <button id="btn-copy" class="btn btn--secondary" data-i18n="btn.copy">Copy Image</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__privacy" data-i18n="footer.privacy">Your data never leaves your browser</span>
      <a href="https://github.com/Hichiro6/qr-code-generator" class="footer__link" data-i18n="footer.openSource">Open Source</a>
    </div>
  </footer>

  <div id="sr-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
